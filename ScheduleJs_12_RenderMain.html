<script>
/* =====================================================================
   ScheduleJs_12_RenderMain.html — MAIN RENDERER & CRUD HANDLERS
   Tanggung jawab:
   - Render semua tabel utama (Proyek, Resources, AHSP, WBS, dst)
   - Modal form untuk CRUD
   - Event binding untuk tombol + / edit / delete
   - Simpan ke DB + markDirty() + auto push opsional
   ===================================================================== */

/* =====================================================================
   BAGIAN 1 — HELPER RENDER
   ===================================================================== */

/** Buat elemen <th> tabel */
function th_(text, cls){
  return '<th' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(text) + '</th>';
}

/** Buat elemen <td> */
function td_(html, cls){
  return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + html + '</td>';
}

/** Render tabel dari array of rows */
function renderTable_(tableId, headers, rows, opts){
  const tbl = document.getElementById(tableId);
  if (!tbl) return;
  opts = opts || {};
  
  if (!rows || !rows.length){
    tbl.innerHTML =
      '<thead><tr>' + headers.map(h => th_(h.label)).join('') + '</tr></thead>' +
      '<tbody><tr><td colspan="' + headers.length + '" class="empty" style="text-align:center;padding:30px;color:#8fa3c4;font-style:italic">' +
      esc(opts.emptyMsg || 'Belum ada data') + '</td></tr></tbody>';
    return;
  }

  let html = '<thead><tr>';
  headers.forEach(h => {
    html += '<th' + (h.align ? ' style="text-align:' + h.align + '"' : '') + '>' + esc(h.label) + '</th>';
  });
  html += '</tr></thead><tbody>';

  rows.forEach((row, i) => {
    html += '<tr>';
    headers.forEach(h => {
      let val = h.get ? h.get(row, i) : row[h.key];
      if (val === null || val === undefined) val = '';
      if (h.align === 'right' && typeof val === 'number') val = fmtNum(val, h.dec || 0);
      html += '<td' + (h.align ? ' style="text-align:' + h.align + '"' : '') + (h.cls ? ' class="' + h.cls + '"' : '') + '>' + val + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody>';
  tbl.innerHTML = html;
}

/** Badge jenis resource */
function badgeJenis_(jenis){
  const j = String(jenis || '').toLowerCase();
  const cls = j === 'upah' ? 'b-upah' : j === 'bahan' ? 'b-bahan' : j === 'alat' ? 'b-alat' : 'b-info';
  return '<span class="badge ' + cls + '">' + esc(jenis || '—') + '</span>';
}

/* =====================================================================
   BAGIAN 2 — RENDER DASHBOARD
   ===================================================================== */
function renderDashboard(){
  const wrap = document.getElementById('kpiWrap');
  if (!wrap) return;

  const proj = getActiveProject();
  const resCount = (DB.master_resources || []).length;
  const ahspCount = (DB.ahsp_headers || []).length;
  const wbsCount = (DB.project_wbs || []).filter(w => w.project_id === APP_STATE.activeProjectId && !num(w.is_group)).length;
  const progCount = (DB.progress || []).filter(p => p.project_id === APP_STATE.activeProjectId).length;

  const totalRAB = (DB.project_wbs || [])
    .filter(w => w.project_id === APP_STATE.activeProjectId && !num(w.is_group))
    .reduce((s, w) => s + num(w.volume_rab), 0);

  wrap.innerHTML = [
    '<div class="kpi"><div class="lbl">Proyek Aktif</div><div class="val">' + esc(proj ? (proj.kode || '—') : '—') + '</div><div class="sub">' + esc(proj ? (proj.nama || '') : 'Pilih proyek') + '</div></div>',
    '<div class="kpi k2"><div class="lbl">Master Resources</div><div class="val">' + resCount + '</div><div class="sub">Upah · Bahan · Alat</div></div>',
    '<div class="kpi k3"><div class="lbl">Template AHSP</div><div class="val">' + ahspCount + '</div><div class="sub">Standar Permen PUPR</div></div>',
    '<div class="kpi k5"><div class="lbl">Item WBS</div><div class="val">' + wbsCount + '</div><div class="sub">' + (wbsCount ? 'Item pada proyek aktif' : 'Belum ada item') + '</div></div>'
  ].join('');

  // Alert wrap
  const alertWrap = document.getElementById('alertWrap');
  if (alertWrap){
    const alerts = [];
    if (!DB.projects || !DB.projects.length) alerts.push('Belum ada proyek. Buka tab <b>🏗 Proyek</b> dan tambahkan.');
    if (!resCount) alerts.push('Belum ada resource. Buka tab <b>🧱 Master Resources</b> dan tambahkan.');
    if (!ahspCount) alerts.push('Belum ada template AHSP. Buka tab <b>📐 AHSP</b> dan tambahkan.');
    if (!wbsCount && APP_STATE.activeProjectId) alerts.push('Proyek aktif belum memiliki item WBS. Buka tab <b>🗂 WBS / BQ</b> dan tambahkan.');

    if (!alerts.length){
      alertWrap.innerHTML = '<div class="alert ok"><span>✅</span><div><b>Semua siap!</b><br>Data dasar sudah tersedia. Anda bisa mulai input WBS, AHSP, dan progress.</div></div>';
    } else {
      alertWrap.innerHTML = alerts.map(a => '<div class="alert info"><span>💡</span><div>' + a + '</div></div>').join('');
    }
  }
}

/* =====================================================================
   BAGIAN 3 — RENDER EXECUTIVE
   ===================================================================== */
function renderExecutive(){
  const kpiWrap = document.getElementById('execKPI');
  if (!kpiWrap) return;

  const projects = DB.projects || [];
  const totalKontrak = projects.reduce((s, p) => s + num(p.nilai_kontrak), 0);

  kpiWrap.innerHTML = [
    '<div class="kpi"><div class="lbl">Total Proyek</div><div class="val">' + projects.length + '</div><div class="sub">Portofolio</div></div>',
    '<div class="kpi k2"><div class="lbl">Nilai Kontrak Total</div><div class="val">' + fmtRp(totalKontrak) + '</div><div class="sub">Semua proyek</div></div>',
    '<div class="kpi k3"><div class="lbl">Proyek Aktif</div><div class="val">' + projects.filter(p => p.status === 'Berjalan').length + '</div><div class="sub">Status: Berjalan</div></div>',
    '<div class="kpi k5"><div class="lbl">Rata-rata Nilai</div><div class="val">' + fmtRp(projects.length ? totalKontrak / projects.length : 0) + '</div><div class="sub">Per proyek</div></div>'
  ].join('');

  // Tabel portfolio
  const tbl = document.getElementById('tblExecPortfolio');
  if (tbl){
    if (!projects.length){
      tbl.innerHTML = '<thead><tr><th>Kode</th><th>Nama</th><th>Lokasi</th><th>Nilai Kontrak</th><th>Status</th></tr></thead>' +
                      '<tbody><tr><td colspan="5" class="empty" style="text-align:center;padding:30px">Belum ada proyek</td></tr></tbody>';
    } else {
      let html = '<thead><tr><th>Kode</th><th>Nama</th><th>Lokasi</th><th style="text-align:right">Nilai Kontrak</th><th>Status</th></tr></thead><tbody>';
      projects.forEach(p => {
        html += '<tr class="exec-row" data-project="' + esc(p.id) + '" style="cursor:pointer">';
        html += td_(esc(p.kode || '—'));
        html += td_(esc(p.nama || '—'));
        html += td_(esc(p.lokasi || '—'));
        html += td_(fmtRp(p.nilai_kontrak), 'num');
        html += td_(esc(p.status || '—'));
        html += '</tr>';
      });
      html += '</tbody>';
      tbl.innerHTML = html;

      // Klik baris → set proyek aktif
      tbl.querySelectorAll('.exec-row').forEach(r => {
        r.addEventListener('click', function(){
          APP_STATE.activeProjectId = this.dataset.project;
          toast('Proyek aktif: ' + (findById(DB.projects, this.dataset.project) || {}).nama);
          renderExecutive();
          renderDashboard();
        });
      });
    }
  }
}

/* =====================================================================
   BAGIAN 4 — RENDER MASTER RESOURCES
   ===================================================================== */
function renderResources(){
  const tbl = document.getElementById('tblRes');
  if (!tbl) return;

  let list = DB.master_resources || [];

  const filterJenis = (document.getElementById('fResJenis') || {}).value || '';
  const filterSearch = String((document.getElementById('fResSearch') || {}).value || '').toLowerCase();

  if (filterJenis) list = list.filter(r => String(r.jenis).toLowerCase() === filterJenis);
  if (filterSearch) list = list.filter(r =>
    String(r.kode || '').toLowerCase().includes(filterSearch) ||
    String(r.nama || '').toLowerCase().includes(filterSearch)
  );

  renderTable_('tblRes',
    [
      { label: 'Kode', get: r => '<code style="color:#7cb3ff;font-weight:700">' + esc(r.kode || '—') + '</code>' },
      { label: 'Nama', get: r => esc(r.nama || '—') },
      { label: 'Jenis', get: r => badgeJenis_(r.jenis) },
      { label: 'Satuan', get: r => esc(r.satuan || '—') },
      { label: 'Harga RAB', align: 'right', get: r => fmtRp(r.harga_rab) },
      { label: 'Harga RAP', align: 'right', get: r => fmtRp(r.harga_rap) },
      { label: 'Kap. Harian', align: 'right', get: r => num(r.kapasitas_harian) || '—' },
      { label: 'Aksi', get: r =>
        '<button class="btn btn-sm" onclick="openResourceModal(\'' + esc(r.id) + '\')" title="Edit">✏️</button> ' +
        '<button class="btn btn-sm" onclick="deleteResource_(\'' + esc(r.id) + '\')" title="Hapus" style="color:#f87171">🗑</button>'
      }
    ],
    list,
    { emptyMsg: filterJenis || filterSearch ? 'Tidak ada resource yang cocok' : 'Belum ada resource. Klik + Resource untuk menambahkan.' }
  );
}

/* =====================================================================
   BAGIAN 5 — RENDER AHSP
   ===================================================================== */
function renderAhsp(){

  renderTable_('tblAhsp',
    [
      { label: 'Kode', get: r => '<code style="color:#7cb3ff;font-weight:700">' + esc(r.kode || '—') + '</code>' },
      { label: 'Nama', get: r => esc(r.nama || '—') },
      { label: 'Kategori', get: r => esc(r.kategori || '—') },
      { label: 'Satuan', get: r => esc(r.satuan || '—') },
      { label: 'Overhead', align: 'right', get: r => fmtNum(r.overhead, 2) + '%' },
      { label: 'Margin', align: 'right', get: r => fmtNum(r.margin, 2) + '%' },
      { label: 'Aksi', get: r =>
        '<button class="btn btn-sm" onclick="openAhspModal(\'' + esc(r.id) + '\')">✏️</button> ' +
        '<button class="btn btn-sm" onclick="deleteAhsp_(\'' + esc(r.id) + '\')" style="color:#f87171">🗑</button>'
      }
    ],
    DB.ahsp_headers || [],
    { emptyMsg: 'Belum ada template AHSP' }
  );

  // Isi dropdown ahspProjSel
  const sel = document.getElementById('ahspProjSel');
  if (sel){
    sel.innerHTML = '<option value="">— Pilih Proyek —</option>';
    (DB.projects || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = (p.kode || '') + ' — ' + (p.nama || '');
      if (p.id === APP_STATE.activeProjectId) opt.selected = true;

}

/* =====================================================================
   BAGIAN 6 — RENDER WBS
   ===================================================================== */
function renderWbs(){
  const tbl = document.getElementById('tblWbs');
  if (!tbl) return;

  const wbsList = (DB.project_wbs || []).filter(w => w.project_id === APP_STATE.activeProjectId);
  wbsList.sort((a, b) => num(a.urut) - num(b.urut));

  renderTable_('tblWbs',
    [
      { label: 'Kode WBS', get: w => '<code style="color:#7cb3ff;font-weight:700">' + esc(w.kode_wbs || '—') + '</code>' },
      { label: 'Uraian', get: w => esc(w.uraian || '—') },
      { label: 'Satuan', get: w => esc(w.satuan || '—') },
      { label: 'Vol RAB', align: 'right', get: w => fmtNum(w.volume_rab, 2) },
      { label: 'Vol RAP', align: 'right', get: w => fmtNum(w.volume_rap, 2) },
      { label: 'Durasi', align: 'right', get: w => num(w.durasi_hari) ? num(w.durasi_hari) + ' hari' : '—' },
      { label: 'Mulai', get: w => esc(w.tgl_mulai_rencana || w.start_date || '—') },
      { label: 'Selesai', get: w => esc(w.tgl_selesai_rencana || w.finish_date || '—') },
      { label: 'Kritis', get: w => num(w.is_critical) === 1 ? '<span style="color:#f87171;font-weight:700">🔥</span>' : '' },
      { label: 'Aksi', get: w =>
        '<button class="btn btn-sm" onclick="openWbsModal(\'' + esc(w.id) + '\')">✏️</button> ' +
        '<button class="btn btn-sm" onclick="deleteWbs_(\'' + esc(w.id) + '\')" style="color:#f87171">🗑</button>'
      }
    ],
    wbsList,
    { emptyMsg: APP_STATE.activeProjectId ? 'Belum ada item WBS pada proyek ini' : 'Pilih proyek aktif terlebih dahulu' }
  );
}

/* =====================================================================
   BAGIAN 7 — RENDER SCHEDULE (Simple)
   ===================================================================== */
function renderSchedule(){
  /* ── Install Task Inspector hook (idempotent) ── */
  if (typeof TaskInspector !== 'undefined' && TaskInspector.installHook) {
    try { TaskInspector.installHook(); } catch(e) { console.error('[renderSchedule] Inspector install:', e); }
  }

  /* ── Render Gantt Chart ── */
  if (typeof renderGantt === 'function') {
    try { renderGantt(); } catch(e) { console.error('[renderSchedule] Gantt error:', e); }
  }

  /* ── Render Resource Loading ── */
  if (typeof renderResourceLoading === 'function') {
    try { renderResourceLoading(); } catch(e) { console.error('[renderSchedule] Resource error:', e); }
  }

  /* ── Render Baseline ── */
  if (typeof renderBaseline === 'function') {
    try { renderBaseline(); } catch(e) { console.error('[renderSchedule] Baseline error:', e); }
  }

  /* ── Tracking toolbar & slip table ── */
  if (typeof Tracking !== 'undefined') {
    try { if (Tracking.injectToolbar) Tracking.injectToolbar(); } catch(e) {}
    try { if (Tracking.renderSlipTable) Tracking.renderSlipTable(); } catch(e) {}
  }

  const wbsList = (DB.project_wbs || []).filter(function(w) {
    return String(w.project_id) === String(APP_STATE.activeProjectId) && !num(w.is_group);
  });

  // KPI
  const kpiWrap = document.getElementById('schedKPI');
  if (kpiWrap){
    const total = wbsList.length;
    const critical = wbsList.filter(function(w) { return num(w.is_critical) === 1; }).length;
    const manual = wbsList.filter(function(w) { return String(w.schedule_mode || 'auto') === 'manual'; }).length;
    const start = wbsList.reduce(function(s, w) {
      return (!s || (w.tgl_mulai_rencana && w.tgl_mulai_rencana < s)) ? w.tgl_mulai_rencana : s;
    }, '');
    const finish = wbsList.reduce(function(s, w) {
      return (!s || (w.tgl_selesai_rencana && w.tgl_selesai_rencana > s)) ? w.tgl_selesai_rencana : s;
    }, '');
    kpiWrap.innerHTML = [
      '<div class="kpi"><div class="lbl">Total Task</div><div class="val">' + total + '</div></div>',
      '<div class="kpi k4"><div class="lbl">Critical</div><div class="val">' + critical + '</div></div>',
      '<div class="kpi k3"><div class="lbl">Manual</div><div class="val">' + manual + '</div></div>',
      '<div class="kpi k2"><div class="lbl">Durasi</div><div class="val">' + esc(start || '-') + ' → ' + esc(finish || '-') + '</div></div>'
    ].join('');
  }

  // Critical Path table
  const critList = wbsList.filter(function(w) { return num(w.is_critical) === 1; });
  renderTable_('tblCritical',
    [
      { label: 'Kode', get: function(w) { return '<code style="color:#fca5a5">' + esc(w.kode_wbs || '-') + '</code>'; } },
      { label: 'Uraian', get: function(w) { return esc(w.uraian || '-'); } },
      { label: 'Mulai', get: function(w) { return esc(w.tgl_mulai_rencana || '-'); } },
      { label: 'Selesai', get: function(w) { return esc(w.tgl_selesai_rencana || '-'); } },
      { label: 'Durasi', align: 'right', get: function(w) { return num(w.durasi_hari); } }
    ],
    critList,
    { emptyMsg: 'Belum ada task pada jalur kritis' }
  );
}

/* =====================================================================
   BAGIAN 10 — RENDER ANALYSIS
   ===================================================================== */

  const tbl = document.getElementById('tblAnalysis');
  if (!tbl) return;
  const wbsList = (DB.project_wbs || []).filter(w => w.project_id === APP_STATE.activeProjectId && !num(w.is_group));

/* =====================================================================
   BAGIAN 13 — RENDER SETTINGS (User & Connection)
   ===================================================================== */
function renderSettings(){
  const tbl = document.getElementById('tblUsers');
  if (!tbl) return;
  renderTable_('tblUsers',

      { label: 'Nama', get: u => esc(u.nama || '—') },
      { label: 'Email', get: u => esc(u.email || '—') },
      { label: 'Role', get: u => {
        const cls = u.role === 'superadmin' ? 'b-danger' : u.role === 'admin' ? 'b-warn' : 'b-info';
        return '<span class="badge ' + cls + '">' + esc(u.role || '—') + '</span>';
      }},
      { label: 'Proyek', get: u => esc(String(u.project_ids || '').slice(0, 40)) },
      { label: 'Aktif', get: u => num(u.aktif) === 1 ? '<span style="color:#4ade80">✓</span>' : '<span style="color:#f87171">✗</span>' }
    ],

/** Helper: buat field input untuk modal */
function fField_(label, name, value, type, attrs){
  type = type || 'text';
  attrs = attrs || '';
  return '<div class="field" style="margin-bottom:10px">' +
    '<label class="f">' + esc(label) + '</label>' +
    '<input type="' + type + '" name="' + name + '" value="' + esc(value || '') + '" ' + attrs + ' />' +
    '</div>';
}

function fSelect_(label, name, value, options){
  let html = '<div class="field" style="margin-bottom:10px"><label class="f">' + esc(label) + '</label><select name="' + name + '">';
  options.forEach(o => {
    html += '<option value="' + esc(o.value) + '"' + (String(o.value) === String(value) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
  });
  html += '</select></div>';
  return html;
}

/** Helper: ambil nilai dari form modal */
function collectModal_(){
  const body = document.getElementById('mBody');
  const data = {};
  body.querySelectorAll('input, select, textarea').forEach(el => {
    if (!el.name) return;
    let v = el.value;
    if (el.type === 'number') v = num(v);
    data[el.name] = v;
  });
  return data;
}

/* =====================================================================
   BAGIAN 17 — EVENT BINDING
   ===================================================================== */
function bindRenderEvents(){
  // Resources
  const btnAddRes = document.getElementById('btnAddRes');
  if (btnAddRes) btnAddRes.addEventListener('click', () => openResourceModal(null));
  const fResJenis = document.getElementById('fResJenis');
  if (fResJenis) fResJenis.addEventListener('change', renderResources);
  const fResSearch = document.getElementById('fResSearch');
  if (fResSearch) fResSearch.addEventListener('input', renderResources);

  // AHSP
  const btnAddAhsp = document.getElementById('btnAddAhsp');
  if (btnAddAhsp) btnAddAhsp.addEventListener('click', () => openAhspModal(null));

  // WBS
  const btnAddWbs = document.getElementById('btnAddWbs');
  if (btnAddWbs) btnAddWbs.addEventListener('click', () => openWbsModal(null));
  const btnRunCPMWBS = document.getElementById('btnRunCPMWBS');
  if (btnRunCPMWBS) btnRunCPMWBS.addEventListener('click', () => {
    if (typeof CPM !== 'undefined' && CPM.run && APP_STATE.activeProjectId){
      const r = CPM.run(APP_STATE.activeProjectId);
      toast(r.ok ? '✅ CPM selesai: ' + r.count + ' task, ' + r.critical + ' kritis' : '⚠ ' + r.message);
      markDirty(); renderWbs();
    } else {
      toast('Modul CPM belum siap', 'warn');
    }
  });

  // Schedule
  const btnRunCPM = document.getElementById('btnRunCPM');
  if (btnRunCPM) btnRunCPM.addEventListener('click', () => {
    if (typeof CPM !== 'undefined' && CPM.run && APP_STATE.activeProjectId){
      const r = CPM.run(APP_STATE.activeProjectId);
      toast(r.ok ? '✅ CPM selesai: ' + r.count + ' task' : '⚠ ' + r.message);
      markDirty(); renderSchedule();
    }
  });

  // Progress
  const btnAddProg = document.getElementById('btnAddProg');
  if (btnAddProg) btnAddProg.addEventListener('click', () => openProgressModal(null));

  // Progress Wizard
  const btnProgWiz = document.getElementById('btnProgressWizard');
  if (btnProgWiz) btnProgWiz.addEventListener('click', () => {
    if (typeof ProgressWizard !== 'undefined') ProgressWizard.open();
    else toast('Modul Progress Wizard belum siap', 'warn');
  });

  // Calendar
  const btnAddCalendar = document.getElementById('btnAddCalendar');
  if (btnAddCalendar) btnAddCalendar.addEventListener('click', () => openCalendarModal(null));

  // Holiday
  const btnAddHoliday = document.getElementById('btnAddHoliday');
  if (btnAddHoliday) btnAddHoliday.addEventListener('click', () => openHolidayModal(null));

  // Project
  const btnAddProj = document.getElementById('btnAddProj');
  if (btnAddProj) btnAddProj.addEventListener('click', () => openProjectModal(null));

  // Settings — Save overhead/PPN
  const btnSaveSet = document.getElementById('btnSaveSet');
  if (btnSaveSet) btnSaveSet.addEventListener('click', () => {
    SETTINGS.overhead_default = num((document.getElementById('setOh') || {}).value);
    SETTINGS.ppn_default = num((document.getElementById('setPpn') || {}).value);
    markDirty();
    toast('✅ Pengaturan disimpan');
  });

  // Report PDF
  const btnReport = document.getElementById('btnReport');

    // Shortcuts help button
  const btnShort = document.getElementById('btnShortcuts');
  if (btnShort && !btnShort._ksBound){
    btnShort._ksBound = true;
    btnShort.addEventListener('click', function(){
      if (typeof KeyboardShortcuts !== 'undefined') KeyboardShortcuts.showHelp();
      else toast('Modul Shortcuts belum siap', 'warn');
    });
  }

  if (btnReport && !btnReport._repBound){
    btnReport._repBound = true;
    btnReport.addEventListener('click', function(){
      if (typeof Reporting !== 'undefined' && Reporting.open) Reporting.open();
      else toast('Modul Reporting belum siap', 'warn');
    });
  }

  console.log('[ScheduleJs_12] Render events bound.');
}

/* =====================================================================
   BAGIAN 18 — BOOTSTRAP
   ===================================================================== */
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', bindRenderEvents);
} else {
  setTimeout(bindRenderEvents, 100);
}

console.log('[ScheduleJs_12] RenderMain module loaded.');

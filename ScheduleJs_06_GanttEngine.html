<script>
/* =====================================================================
   ScheduleJs_06_GanttEngine.html — GANTT RENDERING ENGINE
   Pure logic: date↔pixel, columns, canvas drawing
   ===================================================================== */
var GanttEngine = {

  COL_WIDTHS: { daily: 34, weekly: 64, monthly: 90 },
  ROW_HEIGHT: 26,
  HEADER_HEIGHT: 56,
  BAR_HEIGHT: 16,
  BAR_PADDING: 5,

  /* ── Ambil semua task WBS untuk 1 proyek ── */
  getTasks: function(projectId){
    return (DB.project_wbs || [])
      .filter(w => String(w.project_id) === String(projectId))
      .sort((a, b) => num(a.urut) - num(b.urut));
  },

  /* ── Hitung rentang tanggal proyek ── */
  computeRange: function(tasks){
    let minD = null, maxD = null;
    tasks.forEach(t => {
      const s = t.tgl_mulai_rencana || t.start_date || t.manual_start;
      const f = t.tgl_selesai_rencana || t.finish_date || t.manual_finish;
      if (s){
        const d = new Date(s + 'T00:00:00');
        if (!isNaN(d) && (!minD || d < minD)) minD = d;
      }
      if (f){
        const d = new Date(f + 'T00:00:00');
        if (!isNaN(d) && (!maxD || d > maxD)) maxD = d;
      }
    });
    if (!minD){ minD = new Date(); }
    if (!maxD){ maxD = new Date(Date.now() + 30*86400000); }
    // Padding 3 hari di kiri, 5 hari di kanan
    minD = new Date(minD); minD.setDate(minD.getDate() - 3);
    maxD = new Date(maxD); maxD.setDate(maxD.getDate() + 5);
    return { start: minD, finish: maxD };
  },

  /* ── Build kolom timeline (daily/weekly/monthly) ── */
  buildColumns: function(range, granularity){
    const cols = [];
    const cur = new Date(range.start);
    const end = range.finish;
    const cw = this.COL_WIDTHS[granularity] || 64;

    if (granularity === 'daily'){
      while (cur <= end){
        cols.push({
          date: new Date(cur),
          label: cur.getDate().toString(),
          sublabel: cur.toLocaleDateString('id-ID', { month:'short' }),
          width: cw,
          isWeekend: (cur.getDay() === 0 || cur.getDay() === 6)
        });
        cur.setDate(cur.getDate() + 1);
      }
    } else if (granularity === 'monthly'){
      cur.setDate(1);
      while (cur <= end){
        cols.push({
          date: new Date(cur),
          label: cur.toLocaleDateString('id-ID', { month:'short' }) + ' ' + cur.getFullYear(),
          sublabel: '',
          width: cw,
          isWeekend: false
        });
        cur.setMonth(cur.getMonth() + 1);
      }
    } else { // weekly (default)
      while (cur.getDay() !== 1) cur.setDate(cur.getDate() + 1);
      while (cur <= end){
        const weekNum = this.isoWeek(cur);
        cols.push({
          date: new Date(cur),
          label: 'W' + weekNum,
          sublabel: cur.toLocaleDateString('id-ID', { day:'2-digit', month:'short' }),
          width: cw,
          isWeekend: false
        });
        cur.setDate(cur.getDate() + 7);
      }
    }
    return cols;
  },

  isoWeek: function(d){
    const t = new Date(d.valueOf());
    const dayNr = (d.getDay() + 6) % 7;
    t.setDate(t.getDate() - dayNr + 3);
    const firstThu = t.valueOf();
    t.setMonth(0, 1);
    if (t.getDay() !== 4) t.setMonth(0, 1 + ((4 - t.getDay()) + 7) % 7);
    return 1 + Math.ceil((firstThu - t) / 604800000);
  },

  /* ── Konversi tanggal → pixel X ── */
  dateToX: function(dateVal, cols, granularity){
    if (!dateVal) return 0;
    const d = dateVal instanceof Date ? dateVal : new Date(String(dateVal) + 'T00:00:00');
    if (isNaN(d.getTime())) return 0;
    let x = 0;
    for (let i = 0; i < cols.length; i++){
      const colStart = cols[i].date;
      const colEnd = new Date(colStart);
      if (granularity === 'daily') colEnd.setDate(colEnd.getDate() + 1);
      else if (granularity === 'weekly') colEnd.setDate(colEnd.getDate() + 7);
      else colEnd.setMonth(colEnd.getMonth() + 1);
      if (d < colStart) return x;
      if (d < colEnd){
        const frac = (d - colStart) / (colEnd - colStart);
        return x + frac * cols[i].width;
      }
      x += cols[i].width;
    }
    return x;
  },

  totalWidth: function(cols){
    return cols.reduce((s, c) => s + c.width, 0);
  },

  /* ── Gambar axis (header timeline) ── */
  drawAxis: function(canvas, cols, granularity){
    const dpr = window.devicePixelRatio || 1;
    const w = this.totalWidth(cols);
    const h = this.HEADER_HEIGHT;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0e1a30';
    ctx.fillRect(0, 0, w, h);

    let x = 0;
    cols.forEach(col => {
      // Weekend shading
      if (col.isWeekend){
        ctx.fillStyle = 'rgba(15,23,42,0.6)';
        ctx.fillRect(x, 0, col.width, h);
      }
      // Vertical separator
      ctx.strokeStyle = 'rgba(47,129,247,0.20)';
      ctx.beginPath();
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, h);
      ctx.stroke();

      // Label
      ctx.fillStyle = col.isWeekend ? '#64748b' : '#e6edf7';
      ctx.font = 'bold 11px "Segoe UI",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(col.label, x + col.width/2, h/2 - 7);

      if (col.sublabel){
        ctx.fillStyle = '#8fa3c4';
        ctx.font = '9.5px "Segoe UI",sans-serif';
        ctx.fillText(col.sublabel, x + col.width/2, h/2 + 8);
      }
      x += col.width;
    });

    // Bottom border
    ctx.strokeStyle = '#24365c';
    ctx.beginPath();
    ctx.moveTo(0, h - 0.5);
    ctx.lineTo(w, h - 0.5);
    ctx.stroke();
  },

  /* ── Gambar bars ── */
  drawBars: function(canvas, tasks, cols, granularity, opts){
    opts = opts || {};
    const dpr = window.devicePixelRatio || 1;
    const rowH = this.ROW_HEIGHT;
    const barH = this.BAR_HEIGHT;
    const w = this.totalWidth(cols);
    const h = Math.max(rowH * tasks.length, rowH);

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, w, h);

    // Grid columns
    let x = 0;
    cols.forEach(col => {
      if (col.isWeekend){
        ctx.fillStyle = 'rgba(15,23,42,0.45)';
        ctx.fillRect(x, 0, col.width, h);
      }
      ctx.strokeStyle = 'rgba(36,54,92,0.4)';
      ctx.beginPath();
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, h);
      ctx.stroke();
      x += col.width;
    });

    // Bars per task
    const self = this;
    tasks.forEach((task, idx) => {
      const rowY = idx * rowH;
      const barY = rowY + (rowH - barH) / 2;

      // Zebra row background
      if (idx % 2 === 1){
        ctx.fillStyle = 'rgba(255,255,255,0.012)';
        ctx.fillRect(0, rowY, w, rowH);
      }

      const sISO = task.tgl_mulai_rencana || task.start_date || task.manual_start;
      const fISO = task.tgl_selesai_rencana || task.finish_date || task.manual_finish;
      if (!sISO || !fISO) return;

      const x1 = self.dateToX(sISO, cols, granularity);
      const x2 = self.dateToX(fISO, cols, granularity);
      const barW = Math.max(6, x2 - x1);

      const isCritical = num(task.is_critical) === 1;
      const isGroup = num(task.is_group) === 1;
      const isMilestone = !isGroup && num(task.durasi_hari) === 0;

      if (isMilestone){
        const cx = x1 + 4;
        const cy = barY + barH/2;
        const r = 7;
        ctx.fillStyle = isCritical ? '#dc2626' : '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx + r, cy);
        ctx.lineTo(cx, cy + r);
        ctx.lineTo(cx - r, cy);
        ctx.closePath();
        ctx.fill();
        return;
      }

      if (isGroup){
        // Summary bar (solid dark)
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x1, barY, barW, barH);
        // End caps (downward triangles)
        ctx.beginPath();
        ctx.moveTo(x1, barY + barH);
        ctx.lineTo(x1 + 7, barY + barH);
        ctx.lineTo(x1, barY + barH + 5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x2, barY + barH);
        ctx.lineTo(x2 - 7, barY + barH);
        ctx.lineTo(x2, barY + barH + 5);
        ctx.closePath();
        ctx.fill();
      } else {
        // Normal bar with gradient
        const grad = ctx.createLinearGradient(x1, barY, x1 + barW, barY);
        if (isCritical){
          grad.addColorStop(0, '#dc2626');
          grad.addColorStop(1, '#b91c1c');
        } else {
          grad.addColorStop(0, '#2f81f7');
          grad.addColorStop(1, '#1abc9c');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(x1, barY, barW, barH);

        // Progress overlay
        const prog = num(task.progress);
        if (prog > 0 && prog < 100){
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(x1 + barW * prog / 100, barY, barW * (1 - prog/100), barH);
        }
      }
    });

    // Row grid lines
    ctx.strokeStyle = 'rgba(36,54,92,0.4)';
    for (let i = 0; i <= tasks.length; i++){
      ctx.beginPath();
      ctx.moveTo(0, i * rowH + 0.5);
      ctx.lineTo(w, i * rowH + 0.5);
      ctx.stroke();
    }
  },

  /* ── Gambar dependency arrows (FS sederhana) ── */
  drawDependencies: function(canvas, tasks, cols, granularity){
    const dpr = window.devicePixelRatio || 1;
    const rowH = this.ROW_HEIGHT;
    const barH = this.BAR_HEIGHT;
    const w = this.totalWidth(cols);
    const h = Math.max(rowH * tasks.length, rowH);

    // Canvas overlay — kita buat di canvas terpisah supaya bisa clear
    // (implementasi sederhana: skip dulu, di-render nanti di versi lanjutan)
  }
};

window.GanttEngine = GanttEngine;
console.log('[GanttEngine] Module loaded.');
</script>
